title = "Firefly secret scanning"

[[rules]]
id = "discord-bot-token"
description = "Discord bot token"
regex = '''[MN][A-Za-z\d]{23,27}\.[\w-]{6,7}\.[\w-]{27,}'''
keywords = ["DISCORD_BOT_TOKEN", "discord"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-(?:proj-)?[A-Za-z0-9_-]{40,}'''
keywords = ["OPENAI_API_KEY", "sk-"]
